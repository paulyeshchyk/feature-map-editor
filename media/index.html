<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}};">
<title>Feature Map Editor</title>
<link rel="stylesheet" href="{{style}}">
</head>
<body>
  <header class="toolbar">
    <nav class="tabs">
      <button data-tab="dimensions" class="active">Dimensions</button>
      <button data-tab="fields">Fields</button> 
      <button data-tab="axes">Axes &amp; Roles</button>
      <button data-tab="filters">Filters</button>
      <button data-tab="preview">Preview</button>
      <button data-tab="settings">Settings</button>
    </nav>
    <div class="actions">
      <span id="status" class="status"></span>
      <button id="btn-open-root" class="ghost" title="Выбрать корень проекта">📁</button>
      <button id="btn-reset" class="ghost">Reset</button>
      <button id="btn-save" class="primary">Save</button>
      <button id="btn-generate" class="secondary">Generate</button>
    </div>
  </header>

  <main class="content">
    <section data-tab-content="fields" hidden>
      <div class="section-head">
        <h2>Поля (Fields)</h2>
        <button id="btn-add-field" class="small">+ Добавить поле</button>
      </div>
      <div id="fields-list"></div>
    </section>
    <section data-tab-content="dimensions">
      <div class="section-head">
        <h2>Размерности</h2>
        <button id="btn-add-dim" class="small">+ Добавить размерность</button>
      </div>
      <div id="dims-list"></div>
    </section>

    <section data-tab-content="axes" hidden>
      <h2>Оси и роли</h2>
      <label>Row dimension <select id="sel-row"></select></label>
      <label>Column dimension <select id="sel-col"></select></label>
      <h3>Strip dimensions</h3>
      <div id="strips-list"></div>
    </section>

    <section data-tab-content="filters" hidden>
      <h2>Пустые значения (<code>__empty__</code>)</h2>
      <table id="empty-table"><thead><tr>
        <th>Размерность</th><th>Включать</th><th>Label</th>
      </tr></thead><tbody></tbody></table>
    </section>

    <section data-tab-content="preview" hidden>
      <h2>Предпросмотр</h2>
      <div id="preview-summary"></div>
      <h3>Warnings</h3>
      <ul id="preview-warnings"></ul>
    </section>

    <section data-tab-content="settings" hidden>
      <h2>Настройки генератора</h2>
      <div id="settings-form"></div>
    </section>
  </main>

  <section data-tab-content="preview" hidden>
    <div class="section-head">
      <h2>Схематичный предпросмотр</h2>
    </div>
    
    <div id="preview-schema-container"></div>
    
    <div id="preview-issues" style="margin-top: 32px;">
      <h3 style="font-size: 14px; margin-bottom: 8px;">Предупреждения валидации</h3>
      <ul id="preview-warnings" class="issue-list"></ul>
    </div>
  </section>

  <script type="module" src="{{script}}"></script>
</body>
</html>
